name: Forward-test data

# Weekly backup of the forward test's inputs (scripts/collect_forward.py), committed to
# the forward-data branch so that master and its frozen code stay untouched. The
# evaluation still downloads its data after the period; see docs/forward_test_plan.md.

on:
  schedule:
    - cron: "23 6 * * 1"   # Mondays 06:23 UTC, after the weekend's closes and GDELT files
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch (created on the first run)
        run: |
          if git ls-remote --exit-code --heads origin forward-data > /dev/null; then
            git fetch --depth 1 origin forward-data
            git worktree add store FETCH_HEAD
            git -C store switch -c forward-data
          else
            git worktree add --orphan -b forward-data store
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[yahoo,trends]"

      - name: Collect
        run: python scripts/collect_forward.py store/data/forward

      - name: Commit
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "data: forward-test snapshot through $(jq -r .through data/forward/manifest.json)" \
                     -m "Run $GITHUB_RUN_ID of $GITHUB_WORKFLOW at master $GITHUB_SHA."
          git push origin forward-data
